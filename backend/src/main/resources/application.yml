spring:
  application:
    name: taskora-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskora}
    username: ${DB_USER:taskora}
    password: ${DB_PASSWORD:taskora}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-env}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}

logging:
  level:
    root: INFO
    com.taskora.backend: DEBUG
