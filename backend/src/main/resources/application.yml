spring:
  application:
    name: taskora-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:taskora}
    username: ${DB_USER:taskora}
    password: ${DB_PASSWORD:taskora}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # HS256 exige au moins 256 bits (32 caracteres) : ce defaut est utilisable en dev,
    # mais DOIT etre remplace par un secret aleatoire long via la variable d'env en prod.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-chars-minimum}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-4-5}

logging:
  level:
    root: INFO
    com.taskora.backend: DEBUG
