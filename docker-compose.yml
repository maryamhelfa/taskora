services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-taskora}
      POSTGRES_USER: ${DB_USER:-taskora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskora}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taskora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-taskora}
      DB_USER: ${DB_USER:-taskora}
      DB_PASSWORD: ${DB_PASSWORD:-taskora}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32-chars-minimum}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres_data:
